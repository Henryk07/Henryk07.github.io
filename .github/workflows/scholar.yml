name: Update Google Scholar citations

# Every Monday at 08:00 UTC, or on demand from the Actions tab.
on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: scholar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: google_scholar_crawler/requirements.txt

      - name: Fetch citation data from Google Scholar
        working-directory: google_scholar_crawler
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
        run: |
          pip install -r requirements.txt
          python main.py

      # Live data the page reads in the browser
      - name: Publish to the google-scholar-stats branch
        working-directory: google_scholar_crawler/results
        run: |
          git init -q -b google-scholar-stats
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.json
          git commit -q -m "Update citation data"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" google-scholar-stats

      # Snapshot numbers baked into the HTML, so the page is right even before JS loads
      - name: Update the snapshot in _data and commit if it changed
        run: |
          python google_scholar_crawler/update_snapshot.py
          if git diff --quiet -- _data; then
            echo "Citation counts unchanged."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add _data/academic.yml _data/profile.yml
            git commit -m "chore: update citation snapshot"
            git push
            # Pushes made with GITHUB_TOKEN may not trigger a Pages build on their own
            gh api -X POST "repos/${{ github.repository }}/pages/builds" --silent || echo "Pages rebuild request failed; the next push will rebuild."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
